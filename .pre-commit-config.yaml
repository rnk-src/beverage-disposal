# Local hooks that call ruff through uv, so the version is the one locked in uv.lock and nothing
# is cloned from the network.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: fast-tests
        name: fast tests
        entry: uv run --frozen pytest -m fast -q
        language: system
        pass_filenames: false
      # Local rather than the pre-commit-hooks repo's version, so nothing is cloned. Commits go on
      # a branch; the owner's merge commits use a different git hook and are not affected.
      - id: no-commit-to-branch
        name: no commit to main
        entry: >-
          sh -c 'test "$(git branch --show-current)" != main
          || { echo "on main, switch to a branch"; exit 1; }'
        language: system
        always_run: true
        pass_filenames: false
