# Runs the same `make check` as a local run. The Docker and Gazebo tests are left out of it
# (see the Makefile): they need a Docker daemon and an arm64 package record.
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The runner has no display or GPU; MuJoCo's offscreen renderer needs software rendering.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
      - uses: astral-sh/setup-uv@v6
      # Verbose names each test as it starts, so a slow or hung test shows in the log.
      - run: make check PYTEST_ARGS="-v --durations=15"
