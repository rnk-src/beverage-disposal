[project]
name = "beverage-disposal"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.14,<4",
    "numpy>=2.5,<3",
    "gymnasium>=1.3,<2",
    "scikit-learn>=1.9,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.168,<7",
    "packaging>=26,<27",
    "ruff>=0.16,<0.17",
    "pre-commit>=4.6,<5",
    "pillow>=12,<13",
    "mink>=1.3,<2",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not slow'"
markers = [
    "fast: runs in seconds, on every change (also the tier of any unmarked test)",
    "medium: runs in minutes, before finishing a sub-iteration",
    "slow: runs in hours, on a rented GPU when needed; excluded from the default run",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The ROS-free core only (CLAUDE.md, architecture and code standards).
files = ["src/beverage_disposal/core"]
ignore_missing_imports = true
