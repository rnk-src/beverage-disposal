# The emptiness policy for PET bottles (iteration 2B). The supported sizes are not listed here: they
# are the sizes whose grasp gate passed, in bottles.toml.
alpha = 0.005            # a bottle of 30 mL or more may be binned by the classifier this often at most
delta = 0.05             # the chance that a calibration fails to keep alpha
volume_bins = [30.0, 31.0, 35.0, 50.0]  # mL: the lower edges of the calibration cells
# Assumed. Held-out surely-under bottles all scored 0.965 or more (2B.10), so 0.5 vetoes none of them.
veto_score = 0.5         # the classifier vetoes a bin below this score
# Assumed. The simulated camera reports 1.0 for a sound bottle and 0.4 for a crushed one.
min_confidence = 0.8     # a perception less sure than this is not acted on
# Off by the owner's choice (2026-11-16): the classifier's bins rest on the camera's level reading.
# The rule alone decides a bin; true is for the simulation experiment only.
allow_overturn = false
# If the weight proves this much more liquid than the camera can see, something else is inside.
level_slack_ml = 20.0     # assumed
# The liquid probe is read only if the weight alone proves at most this much liquid (mL), because
# contents it cannot see could weigh about that much. inf switches the limit off; open (2B.14).
probe_reach_ml = inf
