# The scene for iteration 2. Lengths in metres, masses in kilograms, friction is the sliding coefficient.
# The table top is the plane z = 0 of the arm's base frame. Nothing here is measured on a real can.
container_x = 0.27  # the middle of the spawn box
container_y = 0.0
fill_ml = 0.0       # liquid inside the container, water at 1 g per mL
container_type = "can_12floz"  # a table in containers.toml

[table]
center_x = 0.20
half_x = 0.30
half_y = 0.30
thickness = 0.04
friction = 1.0

[bin]
center_x = 0.20
center_y = -0.17
inner_x = 0.10
inner_y = 0.10
height = 0.06
wall = 0.01
floor = 0.005
friction = 1.0

[set_aside]
center_x = 0.28
center_y = 0.17
half_x = 0.045
half_y = 0.05

[pad]
center_x = 0.165
center_y = 0.15
half_x = 0.05
half_y = 0.05
height = 0.02
friction = 1.0

[spawn]
center_x = 0.27
center_y = 0.0
half_size = 0.04

[reach]
min_pitch_deg = 60.0
approach_clearance = 0.04
lift_height = 0.03
release_clearance = 0.01

[grasp]
wrist_roll = 1.5707963  # pi/2: the jaws close sideways, so the tool can tilt forward
pitch_deg = 60.0
open_angle = 1.3
close_target = -0.1
close_rate = 0.02
clearance = 0.002
force_limit = 0.6  # N m; more throws the empty can out of the jaws, less drops a full one

[gripper_pads]
design_angle = 0.9
thickness = 0.008
half_width = 0.008
half_height = 0.012
depth = -0.095
friction = 1.0
torsional_friction = 0.01  # soft pads resist twist; without it a carried can swings on them

[physics]
timestep = 0.002
contact_time_constant = 0.02
contact_damping_ratio = 1.0
